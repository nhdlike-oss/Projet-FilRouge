<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Message privé JaWse">
	<link rel="icon" type="image/png" href="image/logo.png" sizes="32x32">
	<link rel="stylesheet" href="Style.css?v=10">
	<title>JaWse - Message privé</title>
</head>
<body>
    <main id="zone-chat">
			<header id="entete-chat" class="entetePrive">
				<a class="retourPrive" href="Contact.html">&larr; Contacts</a>
				<img id="photoAmi" class="photoMessage" src="image/avatar.png" alt="">
				<h2 id="titre">Chargement…</h2>
			</header>

			<ul id="messages"></ul>

			<form id="formulaire">
				<input type="text" id="champ" placeholder="Écrire un message…" autocomplete="off" maxlength="2000" required>
				<button type="submit">Envoyer</button>
			</form>
	</main>

	
	<div id="page_web" class="salon-ouvert">

		<!-- Barre violette à gauche -->
		<aside id="barre">
			<div id="profil">
				<div id="profil-texte">
					<strong id="nom-utilisateur"></strong>
					<small><span class="point"></span> En ligne</small>
				</div>
			</div>

			<!-- Une seule liste visible à la fois -->
			<h2 id="titreListe">Messages privés</h2>
			<ul id="liste-prives" class="listePrive"></ul>
			<ul id="liste-salons" class="listePrive" hidden></ul>

			<!-- Liens du bas -->
			<button type="button" id="basculer" class="lien-barre">Salons</button>
			<a href="Contact.html" class="lien-barre">Mes contacts</a>
			<a href="Profil.html" class="lien-barre">Profil</a>
		</aside>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="supabase.js"></script>
	<script src="prive.js?v=4"></script>
</body>
</html>
