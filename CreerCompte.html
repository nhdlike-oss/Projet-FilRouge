<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Créer un compte JaWse">
	<link rel="icon" type="image/png" href="image/logo.png" sizes="32x32">
	<link rel="stylesheet" href="Style.css">
	<title>JaWse - Créer un compte</title>
</head>
<body class="corpsPage pageForm">

	<main class="split">

		<!-- Partie gauche : violet -->
		<section class="cote">
			<span class="forme forme1" aria-hidden="true"></span>
			<span class="forme forme2" aria-hidden="true"></span>
			<span class="forme forme3" aria-hidden="true"></span>

			<a class="marque" href="index.html">
				<img class="logo" src="image/logo.png" alt="">
				<h1>JaWse</h1>
			</a>

			<div class="coteTexte">
				<h2>Rejoins la communauté JaWse</h2>
				<p>Rencontre de nouvelles personnes, partage ce qui compte pour toi et échange en toute sécurité, où que tu sois.</p>
			</div>
		</section>

		<!-- Partie droite : formulaire -->
		<section class="cadre">
			<a class="retour" href="index.html">
				<span class="fleche" aria-hidden="true">&larr;</span>
				Retour
			</a>

			<h2>Créer un compte</h2>
			<p class="sousTitre">Tu pourras commencer à discuter dès ton inscription.</p>

			<form class="formCompte" action="/inscription" method="post">

				<label class="champ" for="Courriel">
					Courriel *
					<input type="email" id="Courriel" name="Courriel" autocomplete="email" required>
				</label>

				<label class="champ" for="Mot_de_pass">
					Mot de passe *
					<input type="password" id="Mot_de_pass" name="Mot_de_pass" autocomplete="new-password" minlength="8" required>
					<small class="aide">Au moins 8 caractères, avec un chiffre, une majuscule et un caractère spécial.</small>
          <input type="password" id="Mot_de_pass" name="Mot_de_pass" autocomplete="new-password" minlength="8" required placeholder="Confirmer votre mot de passe">
				</label>

				<div class="ligne">
					<label class="champ" for="Numero_Cell">
						Numéro de cellulaire
						<input type="tel" id="Numero_Cell" name="Numero_Cell" autocomplete="tel">
					</label>

					<label class="champ" for="Age">
						Âge *
						<input type="number" id="Age" name="Age" min="13" max="120" required>
					</label>
				</div>

				<label class="champ" for="pays">
					Pays *
					<select id="pays" name="pays" required>
						<option value="">Sélectionne un pays</option>
						<option>Canada</option>
						<option>France</option>
						<option>Chine</option>
						<option>Sénégal</option>
						<option>Inde</option>
						<option>Uruguay</option>
						<option>Colombie</option>
					</select>
				</label>

				<button type="submit" class="boutonForm">S'inscrire</button>
			</form>

			<p class="lienBas">Déjà un compte ? <a href="index.html#connexion">Se connecter</a></p>
		</section>

	</main>

	<script src="Conversation.js"></script>
	<script src="supabase.js"></script>
</body>
</html>
