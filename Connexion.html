<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Connexion à JaWse">
	<link rel="icon" type="image/png" href="image/logo.png" sizes="32x32">
	<link rel="stylesheet" href="Style.css">
	<title>JaWse - Connexion</title>
</head>
<body class="corpsPage pageForm">

	<main class="split">

		<!-- Partie gauche : violet -->
		<section class="cote">
			<span class="forme forme1" aria-hidden="true"></span>
			<span class="forme forme2" aria-hidden="true"></span>
			<span class="forme forme3" aria-hidden="true"></span>

			<a class="marque" href="index.html">
				<img class="logo" src="image/logo.png" alt="">
				<h1>JaWse</h1>
			</a>
        </section>
        <section class="cadre">
			<a class="retour" href="index.html">
				<span class="fleche" aria-hidden="true">&larr;</span>
				Retour
			</a>

            <h2>Connexion</h2>
			<p class="sousTitre">Entre ton courriel et ton mot de passe.</p>
            
			<!-- Message d'erreur affiché par Connexion.js si la connexion échoue -->
            <p id="erreurConnexion" class="messageErreur" role="alert" hidden></p>

            <form class="formCompte" id="formConnexion">
				<label class="champ" for="contact">
					Courriel
					<input type="email" name="contact" id="contact" autocomplete="email" required>
				</label>
                <label class="champ" for="pwd">
					Mot de passe
					<input type="password" name="password" id="pwd" autocomplete="current-password" required>
				</label>

				<p class="lienBas" style="text-align: right;"><a href="Mot_de_Pass_Oublie.html">Mot de passe oublié ?</a></p>

				<button type="submit" class="boutonForm">Se connecter</button>
			</form>

			<!-- Lien vers l'inscription pour ceux qui n'ont pas de compte -->
			<p class="lienBas">Pas encore de compte ? <a href="CreerCompte.html">Inscris-toi</a></p>
		
        </section>
                    
	</main>

    <footer class="piedPage">
		<nav class="piedLiens">
			<a href="conditions_utilisation_EntrNousQuebec.html">Conditions d'utilisation</a>
			<a href="politique_confidentialité.html">Politique de confidentialité</a>
			<a href="#">En savoir plus</a>
		</nav>
		<p>© 2026 JaWse. Tous droits réservés.</p>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="Supabase.js"></script>
	<script src="Connexion.js"></script>
</body>
</html>
