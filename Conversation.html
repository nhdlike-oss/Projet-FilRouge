<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jase</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <div id="page_web">

    <!-- Barre de gauche -->
    <aside id="barre">

      <div id="profil">
        <div id="profil-texte">
          <strong id="nom-utilisateur"></strong>
          <small><span class="point"></span> En ligne</small>
        </div>
      </div>

      <h2 id="titre-liste">Salons</h2>
      <ul id="liste-conversations"></ul>
      <ul id="liste-prives" hidden></ul>

      <form id="formulaire-conversation">
        <input type="text" id="nom-conversation" placeholder="Nouveau salon" autocomplete="off" required>
        <button type="submit">+</button>
      </form>
      <p id="erreur-conversation" class="erreur"></p>
            

      <h2>En ligne</h2>
      <ul id="liste-en-ligne"></ul>

      <a href="Contact.html" class="lien-barre">Mes contacts</a>
      <a href="Profil.html" class="lienProfil">Profil</a>
      <button id="bouton-parametres" type="button">Paramètres</button>
      <button id="bouton-notifications" type="button">Notifications</button>

    </aside>

    <!-- Zone de droite -->
    <main id="zone-chat">
      <header id="entete-chat">
        <button id="bouton-retour" type="button">← Retour</button>
        <h2 id="titre">Choisis ou crée un salon</h2>
      </header>

      <ul id="messages"></ul>
      <p id="indicateur-ecriture" hidden></p>

      <form id="formulaire" hidden>
        <input type="text" id="champ" placeholder="Écrire un message…" autocomplete="off" required>
        <button type="submit">Envoyer</button>
      </form>
    </main>

  </div>

  <div id="notification" hidden></div>

  <dialog id="popup-parametres">
    <h2>Paramètres</h2>
    <p>Connecté : <strong id="parametres-nom"></strong></p>
    <button id="bouton-deconnexion" type="button">Se déconnecter</button>
    <button id="bouton-supprimer" type="button" class="danger">Supprimer le compte</button>
    <button id="bouton-fermer" type="button" class="clair">Fermer</button>
  </dialog>
 <dialog id="popup-notifications">
  <iframe id="cadre-notifications" title="Notifications"></iframe>
  <button id="bouton-fermer-notif" type="button" class="clair">Fermer</button>
</dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Supabase.js"></script>
  <script src="Conversation.js"></script>
</body>
</html>
