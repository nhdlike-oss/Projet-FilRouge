<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Mon profil JaWse">
	<link rel="icon" type="image/png" href="image/logo.png" sizes="32x32">
	<link rel="stylesheet" href="Style.css">
	<title>JaWse - Mon profil</title>
</head>
<body class="corpsPage pageForm">

	<main class="split">

		<!-- Partie gauche-->
		<section class="cote">
			<span class="forme forme1" aria-hidden="true"></span>
			<span class="forme forme2" aria-hidden="true"></span>
			<span class="forme forme3" aria-hidden="true"></span>

			<a class="marque" href="index.html">
				<img class="logo" src="image/logo.png" alt="">
				<h1>JaWse</h1>
			</a>

			<!-- Texte qui invite à personnaliser son profil -->
			<div class="coteTexte">
				<h2>Ton espace à toi</h2>
				<p>Choisis ta photo, présente-toi en quelques mots et laisse les autres découvrir qui tu es.</p>
			</div>
		</section>

        <section class="cadre">
			<a class="retour" href="Conversation.html">
				<span class="fleche" aria-hidden="true">&larr;</span>
				Retour
			</a>

			<h2>Mon profil</h2>

			<!-- Message de succès ou d'erreur affiché par Profil.js -->
            <p id="messageProfil" role="alert" hidden></p>

			<form class="formCompte" id="formProfil">

				<!-- Photo de profil -->
								<!-- Photo de profil -->
				<div class="photoProfil">
					<img id="apercu" class="avatar" src="image/avatar.png" alt="Ta photo de profil">
					<div>
						<label class="boutonPhoto" for="photo">Modifier la photo</label>
						<input type="file" id="photo" name="photo" accept="image/png, image/jpeg, image/webp" hidden>
						<button type="button" class="boutonSupprimer" id="supprimerPhoto" hidden>Supprimer la photo</button>
					</div>
				</div>

				<label class="champ" for="pseudo">
					Nom d'utilisateur *
					<input type="text" id="pseudo" name="pseudo" maxlength="30" required>
				</label>

				<label class="champ" for="bio">
					Bio
					<textarea id="bio" name="bio" rows="3" maxlength="150" placeholder="Parle un peu de toi…"></textarea>
				</label>

				<button type="submit" class="boutonForm">Enregistrer</button>
			</form>
		</section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="Scripts/Supabase.js"></script>
	<script src="Scripts/Profil.js"></script>
</body>

</html>
