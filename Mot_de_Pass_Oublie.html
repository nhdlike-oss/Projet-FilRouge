<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Réinitialiser le mot de passe JaWse">
	<link rel="icon" type="image/png" href="image/logo.png" sizes="32x32">
	<link rel="stylesheet" href="Style.css">
	<title>JaWse - Mot de passe oublié</title>
</head>
<body class="corpsPage pageForm">

	<main class="split">

		<!-- formulaire -->
		<section class="cadre">
			<a class="retour" href="index.html">
				<span class="fleche" aria-hidden="true">&larr;</span>
				Retour
			</a>

			<h2>Mot de passe oublié</h2>
			<p class="sousTitre">Entre ton email ou ton numéro, puis choisis un nouveau mot de passe.</p>

			<form class="formCompte">

				<label class="champ" for="contact">
					Email ou numéro de téléphone *
					<input type="text" id="contact" name="contact" autocomplete="username" required>
				</label>

				<label class="champ" for="pwd">
					Nouveau mot de passe *
					<input type="password" id="pwd" name="password" autocomplete="new-password" minlength="8" required>
					<small class="aide">Au moins 8 caractères, avec un chiffre, une majuscule et un caractère spécial.</small>
				</label>

				<label class="champ" for="pwdConfirm">
					Confirme ton mot de passe *
					<input type="password" id="pwdConfirm" name="passwordConfirm" autocomplete="new-password" minlength="8" required>
				</label>

				<button type="submit" class="boutonForm">Enregistrer</button>
			</form>

			<p class="lienBas">Tu t'en souviens ? <a href="index.html#connexion">Se connecter</a></p>
		</section>

	</main>

	<script src="Conversation.js"></script>
	<script src="supabase.js"></script>
</body>
</html>
